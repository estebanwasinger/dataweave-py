name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Publish to TestPyPI, or recover the failed PyPI publish for 1.1.2"
        type: choice
        default: testpypi
        options:
          - testpypi
          - recover-pypi-1.1.2

concurrency:
  group: publish-packages-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      next_version: ${{ steps.resolve.outputs.next_version }}
      publish_target: ${{ steps.resolve.outputs.publish_target }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'recover-pypi-1.1.2' && 'release' || github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (inputs.publish_target == 'recover-pypi-1.1.2' && '1.1.2') || '' }}
        run: >-
          python scripts/release_version.py resolve
          --event-name "$EVENT_NAME"
          --release-tag "$RELEASE_TAG"
          --pyproject pyproject.toml

  build-sdist:
    runs-on: ubuntu-latest
    needs: resolve-version
    if: github.event_name != 'workflow_dispatch' || inputs.publish_target == 'testpypi'
    permissions:
      contents: read
    env:
      UV_CACHE_DIR: .uv-cache
      DWPY_DATAWEAVE_DOCS: docs-dataweave/modules/ROOT/pages
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out official DataWeave docs examples
        uses: actions/checkout@v4
        with:
          repository: mulesoft/docs-dataweave
          path: docs-dataweave

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv artifacts
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Set package version from release
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          CURRENT_VERSION="$(uv version --short)"
          if [ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]; then
            uv version "$RELEASE_VERSION"
          fi
          uv lock

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run Python tests
        run: uv run --extra dev python -m pytest

      - name: Clean distribution directory
        run: rm -rf dist

      - name: Build source distribution
        run: uv build --sdist --out-dir dist --no-create-gitignore

      - name: Check source distribution
        run: uv run --extra dev python -m twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build wheel (${{ matrix.platform.artifact }})
    runs-on: ${{ matrix.platform.os }}
    needs: resolve-version
    if: github.event_name != 'workflow_dispatch' || inputs.publish_target == 'testpypi'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.10
            artifact: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.10
            artifact: linux-aarch64
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: auto
            interpreter: python
            artifact: macos-universal2
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
            interpreter: python
            artifact: windows-x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set package version from release
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          CURRENT_VERSION="$(uv version --short)"
          if [ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]; then
            uv version "$RELEASE_VERSION"
          fi

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.platform.target != 'x86_64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist -i ${{ matrix.platform.interpreter }} --compatibility pypi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  publish-python:
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - build-sdist
      - build-wheels
    if: github.event_name != 'workflow_dispatch' || inputs.publish_target == 'testpypi'
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: needs.resolve-version.outputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: needs.resolve-version.outputs.publish_target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  recover-pypi-1-1-2:
    runs-on: ubuntu-latest
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'recover-pypi-1.1.2'
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download 1.1.2 source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35878064429

      - name: Download 1.1.2 wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35878064429

      - name: Verify recovered distributions are version 1.1.2
        run: |
          shopt -s nullglob
          distributions=(dist/*)
          if [ "${#distributions[@]}" -ne 5 ]; then
            echo "Expected the source distribution and four wheels; found ${#distributions[@]}." >&2
            exit 1
          fi
          for distribution in "${distributions[@]}"; do
            filename="$(basename "$distribution")"
            if [[ "$filename" != dataweave_py-1.1.2.tar.gz && "$filename" != dataweave_py-1.1.2-* ]]; then
              echo "Unexpected distribution: $distribution" >&2
              exit 1
            fi
          done

      - name: Publish recovered distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  build-wasm:
    runs-on: ubuntu-latest
    needs: resolve-version
    if: github.event_name == 'release'
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Set npm package version from release
        working-directory: packages/dataweave-wasm
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Build Node WASM package
        run: wasm-pack build crates/dwpy-wasm --release --target nodejs --out-dir ../../packages/dataweave-wasm/dist

      - name: Remove generated ignore file
        run: rm -f packages/dataweave-wasm/dist/.gitignore

      - name: Run WASM package tests
        working-directory: packages/dataweave-wasm
        run: npm test

      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: dataweave-wasm
          path: packages/dataweave-wasm
          if-no-files-found: error

  publish-wasm:
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - build-wasm
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download WASM package
        uses: actions/download-artifact@v4
        with:
          name: dataweave-wasm
          path: packages/dataweave-wasm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@estebanwasinger"

      - name: Check whether this version is already published
        id: existing
        working-directory: packages/dataweave-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if npm view "@estebanwasinger/dataweave-wasm@$RELEASE_VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish WASM package
        if: steps.existing.outputs.exists == 'false'
        working-directory: packages/dataweave-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Report existing WASM package version
        if: steps.existing.outputs.exists == 'true'
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: echo "WASM version $RELEASE_VERSION is already published; skipping duplicate publish."

  bump-version:
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - publish-python
      - publish-wasm
      - recover-pypi-1-1-2
    if: >-
      always() &&
      needs.resolve-version.result == 'success' &&
      (
        (github.event_name == 'release' &&
          needs.publish-python.result == 'success' &&
          needs.publish-wasm.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
          inputs.publish_target == 'recover-pypi-1.1.2' &&
          needs.recover-pypi-1-1-2.result == 'success')
      )
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Choose a non-decreasing next version
        id: version
        env:
          RELEASE_NEXT_VERSION: ${{ needs.resolve-version.outputs.next_version }}
        run: >-
          python scripts/release_version.py prepare-bump
          --release-next-version "$RELEASE_NEXT_VERSION"
          --pyproject pyproject.toml
          --npm-package packages/dataweave-wasm/package.json

      - name: Update package versions and lockfile
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv version "$NEXT_VERSION"
          uv lock

      - name: Update npm package version
        working-directory: packages/dataweave-wasm
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version

      - name: Commit and push version update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- pyproject.toml uv.lock packages/dataweave-wasm/package.json; then
            echo "Package manifests already match the next version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock packages/dataweave-wasm/package.json
          NEXT_VERSION="$(uv version --short)"
          git commit -m "chore(release): bump version to $NEXT_VERSION"
          git push origin "HEAD:$DEFAULT_BRANCH"
