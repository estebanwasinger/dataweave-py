[package]
name = "dwpy-python"
version = "0.1.0"
description = "PyO3 bridge for the DataWeave Rust runtime"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_dwpy_rust"
crate-type = ["cdylib"]

[dependencies]
dwpy-core = { path = "../dwpy-core" }
pyo3 = { version = "0.27.1", features = ["extension-module", "abi3-py310"] }
serde_json = "1"
