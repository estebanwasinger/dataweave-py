name: Publish DataWeave WASM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version without a leading v
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@unlockre"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build Node WASM package
        run: wasm-pack build crates/dwpy-wasm --release --target nodejs --out-dir ../../packages/dataweave-wasm/dist

      - name: Set package version
        working-directory: packages/dataweave-wasm
        run: |
          VERSION="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}"
          npm version "${VERSION#v}" --no-git-tag-version

      - name: Publish package
        working-directory: packages/dataweave-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
