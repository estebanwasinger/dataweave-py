name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Select PyPI repository"
        type: choice
        default: pypi
        options:
          - pypi
          - testpypi
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_CACHE_DIR: .uv-cache
      DWPY_DATAWEAVE_DOCS: docs-dataweave/modules/ROOT/pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout official DataWeave docs examples
        uses: actions/checkout@v4
        with:
          repository: mulesoft/docs-dataweave
          path: docs-dataweave

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv artifacts
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run --extra dev python -m pytest

      - name: Clean distribution directory
        run: rm -rf dist

      - name: Build source distribution
        run: uv build --sdist --out-dir dist --no-create-gitignore

      - name: Check source distribution
        run: uv run --extra dev python -m twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build wheel (${{ matrix.platform.artifact }})
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.10
            artifact: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.10
            artifact: linux-aarch64
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: auto
            interpreter: python
            artifact: macos-universal2
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
            interpreter: python
            artifact: windows-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup QEMU
        if: runner.os == 'Linux' && matrix.platform.target != 'x86_64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist -i ${{ matrix.platform.interpreter }} --compatibility pypi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-sdist
      - build-wheels
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Determine publish target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.publish_target }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=pypi" >> "$GITHUB_OUTPUT"
          fi

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: steps.target.outputs.value == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: steps.target.outputs.value == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
