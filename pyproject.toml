[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "dataweave-py"
version = "1.0.0"
description = "DataWeave interpreter with a Rust-native engine and Python bridge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Esteban Wasinger", email = "estebanwasinger@gmail.com"}
]
maintainers = [
    {name = "Esteban Wasinger", email = "estebanwasinger@gmail.com"}
]
keywords = [
    "dataweave",
    "data-transformation",
    "etl",
    "mulesoft",
    "interpreter",
    "functional-programming"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0.3",
    "tabulate>=0.10.0",
]

[project.scripts]
dwpy-lsp = "dwpy.lsp.server:main"

[project.urls]
Homepage = "https://github.com/estebanwasinger/dataweave-py"
Documentation = "https://github.com/estebanwasinger/dataweave-py#readme"
Repository = "https://github.com/estebanwasinger/dataweave-py"
Issues = "https://github.com/estebanwasinger/dataweave-py/issues"

[project.optional-dependencies]
core = []
pandas = [
    "pandas>=2.3.3",
]
pydantic = [
    "pydantic>=2.12.3",
]
lsp = [
    "pygls>=1.3.1",
]
full = [
    "pandas>=2.3.3",
    "pydantic>=2.12.3",
    "pygls>=1.3.1",
]
dev = [
    "pandas>=2.3.3",
    "pydantic>=2.12.3",
    "pygls>=1.3.1",
    "pytest>=8.4.2",
    "ipykernel>=7.1.0",
]

[tool.maturin]
manifest-path = "crates/dwpy-python/Cargo.toml"
module-name = "dwpy._dwpy_rust"
python-source = "."
include = [
    { path = "dwpy/modules/**/*.dwl", format = ["sdist", "wheel"] },
    { path = "dwpy/modules/**/*.bdwl", format = ["sdist", "wheel"] },
]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.3",
    "pygls>=1.3.1",
    "twine>=6.2.0",
]
