[package]
name = "dwpy-core"
version = "0.1.0"
description = "Core Rust foundation for the DataWeave Python runtime"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
digest = "0.10"
md-5 = "0.10"
md2 = "0.10"
num-bigint = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
